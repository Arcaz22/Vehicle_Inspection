quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:vehicle_local}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/vehicle}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

quarkus.mongodb.connection-string=${MONGO_CONNECTION_STRING:mongodb://vehicle:vehicle_local@localhost:27017/?authSource=admin}
quarkus.mongodb.database=${MONGO_DATABASE:vehicle_audit}

quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.serialization-inclusion=non-null

quarkus.smallrye-openapi.info-title=Vehicle Inspection API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API untuk inspeksi kendaraan, sinkronisasi offline, dan audit.
quarkus.swagger-ui.always-include=true
